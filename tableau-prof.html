<script type="module">
import { collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

var LVLCOLOR={a1:'#C0392B',a2:'#E07B39',b1:'#D4920A',b2:'#7CB82F',c1:'#27AE60',c2:'#1A5C38'};
var LESSON_NAMES={
  'etre':'A1 · Le verbe Être',
  'avoir':'A1 · Le verbe Avoir',
  'c1_francine_gosselin':'C1 · Francine G. (compréhension)',
  'a1_les_nombres':'A1 · Les nombres',
  'a2_nombres_quiz':'A2 · Quiz Les nombres',
  'a2_ecoute_invitations':'A2 · Écoute — Invitations',
  'a2_lire_invitation':'A2 · Lire une invitation',
  'b1_lire_faire_part':'B1 · Lire un faire-part',
  'b1_interrogatifs':'B1 · Les interrogatifs',
  'b2_interrogatifs':'B2 · Les interrogatifs'
};
function fdate(ms){ try{ return new Date(Number(ms)).toLocaleDateString('fr-FR'); }catch(e){ return ''; } }
function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }

function ready(cb){ if(window.LEM && window.LEM.user) cb(); else document.addEventListener('lem-auth-ready', cb); }

// Catalogue : titres, niveaux et compétences par clé de progression
var CAT={byProgress:{},byTest:{}};
var CATREADY=fetch('catalog.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(c){
  CAT.raw=c;
  (c.exercices||[]).forEach(function(e){
    var meta={titre:e.titre,niveau:e.niveau,competences:e.competences||[]};
    if(e.progressId) CAT.byProgress[e.progressId]=meta;
    CAT.byProgress[e.id]=CAT.byProgress[e.id]||meta;          // clé = ID (bouton Terminé)
  });
  (c.lecons||[]).forEach(function(l){ CAT.byProgress[l.id]={titre:'📖 '+l.titre,niveau:l.niveau,competences:[]}; });
  (c.tests||[]).forEach(function(x){ CAT.byTest[x.id]={titre:x.titre,niveau:x.niveau}; });
  return fetch('parcours.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(p){ CAT.parcours=p; }).catch(function(){});
}).catch(function(){});

// Position d'un élève dans le parcours de son niveau (mêmes règles que l'accueil)
function positionParcours(level, lessons){
  var par=CAT.parcours, c=CAT.raw;
  if(!par||!c) return null;
  var weeks=(par.semaines||[]).filter(function(w){return (w.niveau||'').toLowerCase()===level;});
  if(!weeks.length) return null;
  var done={};
  lessons.forEach(function(l){ if(l.completed) done[l.id]=true; });
  var keyOf=function(x){
    var e=c.exercices.find(function(e){return e.id===x;});
    if(e) return e.progressId||null;
    var ts=(c.tests||[]).find(function(t){return t.id===x;});
    return ts?ts.id:null;
  };
  var dayDone=function(j){
    var keys=j.plan.map(keyOf).filter(Boolean);
    return keys.length>0 && keys.every(function(k){return done[k];});
  };
  for(var wi=0;wi<weeks.length;wi++){
    for(var ji=0;ji<weeks[wi].jours.length;ji++){
      if(!dayDone(weeks[wi].jours[ji]))
        return '📅 Semaine '+weeks[wi].numero+' · Jour '+(ji+1)+'/'+weeks[wi].jours.length;
    }
  }
  return '📅 Parcours terminé 🎉';
}
var COMP_LABELS={listening:'🎧 Écoute',reading:'📖 Lecture',writing:'✍️ Écriture',speaking:'🗣️ Oral'};
function fduree(sec){ if(typeof sec!=='number') return ''; var m=Math.floor(sec/60),s=sec%60; return ' · ⏱ '+m+' min '+(s<10?'0':'')+s; }

ready(async function(){
  var content=document.getElementById('content');
  try{
    var db=window.LEM.db;
    var me=await window.LEM.getUser();
    if(!me || me.role!=='teacher'){
      content.innerHTML='<div class="notice">Cette page est r&eacute;serv&eacute;e au professeur.</div>';
      return;
    }
    await CATREADY;
    var usnap=await getDocs(collection(db,'users'));
    var students=[];
    for(const d of usnap.docs){
      var u=d.data()||{}; if(u.role==='teacher') continue;
      var lessons=[];
      try{
        var lsnap=await getDocs(collection(db,'progress',d.id,'lessons'));
        lsnap.forEach(function(ld){ var x=ld.data()||{}; x.id=ld.id; lessons.push(x); });
      }catch(e){}
      students.push({uid:d.id,name:u.displayName||'',email:u.email||'',level:(u.level||'a1'),
        streak:u.streak||0, vocab:(u.vocab||[]).length, lessons:lessons});
    }
    // 🎯 Réconciliation des pré-attributions (04/08) : si la fiche d'un élève
    // pré-attribué existe (créée en a1 par une vieille page en cache, ou avant
    // la pré-attribution), on applique son niveau ICI et on retire l'entrée.
    // → le tableau de bord s'auto-répare à chaque ouverture.
    try{
      var pre=await window.LEM.getConfig('_preassign');
      if(pre && pre.emails){
        var changed=false;
        for (const s of students){
          var em=(s.email||'').toLowerCase();
          var lv=pre.emails[em];
          if(lv && ['a1','a2','b1','b2','c1','c2'].indexOf(lv)>=0){
            if((s.level||'a1').toLowerCase()!==lv){
              await setDoc(doc(db,'users',s.uid),{ level: lv },{ merge:true });
              s.level=lv;
            }
            delete pre.emails[em];
            changed=true;
          }
        }
        if(changed) await window.LEM.setConfig('_preassign',pre);
      }
    }catch(e){}
    render(content, students);
  }catch(e){
    content.innerHTML='<div class="notice">Erreur de chargement. R&eacute;essaie. ('+esc(e.message||e)+')</div>';
  }
});

function annonces(students){
  var parNiveau={};
  students.forEach(function(s){ var l=(s.level||'a1').toLowerCase(); (parNiveau[l]=parNiveau[l]||[]).push(s); });
  var recents={};
  if(CAT.raw){
    [].concat(CAT.raw.lecons||[],CAT.raw.exercices||[]).forEach(function(x){
      if(!x.ajoute||!x.publie) return;
      if(Date.now()-Date.parse(x.ajoute)>21*86400000) return;
      (recents[x.niveau]=recents[x.niveau]||[]).push(x.titre);
    });
  }
  var html='<div style="background:#fff;border:1px solid var(--divider);border-radius:14px;padding:12px 14px;margin-bottom:14px;">'+
           '<b>📣 Annoncer les nouveautés</b> <span style="font-size:12px;color:var(--slate);">(ouvre ton logiciel de courrier, adresses en copie cachée — tu relis avant d\'envoyer)</span><br>';
  ['a1','a2','b1','b2','c1','c2'].forEach(function(l){
    var grp=parNiveau[l]; if(!grp||!grp.length) return;
    var L=l.toUpperCase();
    var items=recents[L]||[];
    var corps='Bonjour,\n\nDu nouveau sur leo-et-moi.com pour ton niveau '+L+' :\n'+
      (items.length?items.map(function(t){return '• '+t;}).join('\n'):'• De nouveaux contenus t\'attendent !')+
      '\n\nConnecte-toi et clique sur la cloche 🔔 pour les retrouver.\n\nBon travail !\nEric';
    var href='mailto:?bcc='+encodeURIComponent(grp.map(function(s){return s.email;}).filter(Boolean).join(','))+
      '&subject='+encodeURIComponent('Nouveau sur leo-et-moi.com ('+L+')')+
      '&body='+encodeURIComponent(corps);
    html+='<a href="'+href+'" style="display:inline-block;margin:4px 6px 2px 0;padding:6px 12px;border-radius:10px;'+
      'background:'+(LVLCOLOR[l]||'#888')+';color:#fff;font-weight:bold;font-size:13px;text-decoration:none;">'+
      '📣 '+L+' ('+grp.length+')</a>';
  });
  return html+'</div>';
}

// ── Gestion du contenu : interrupteurs Masqué 🔧 / Démo 🎓 (Eric, 28/07) ──
async function blocGestion(){
  var c=CAT.raw; if(!c) return '';
  var masques=[], demos=[];
  try{ var m=await window.LEM.getConfig('_masquage'); masques=(m&&m.ids)||[]; }catch(e){}
  try{ var d=await window.LEM.getConfig('_demo'); demos=(d&&d.ids)||[]; }catch(e){}
  var items=[].concat(
    (c.lecons||[]).map(function(x){return {id:x.id,titre:'📖 '+x.titre,niveau:x.niveau,ordre:x.ordre||0};}),
    (c.exercices||[]).map(function(x){return {id:x.id,titre:'✏️ '+x.titre,niveau:x.niveau,ordre:x.ordre||0};}));
  var rows='';
  ['A1','A2','B1','B2','C1','C2'].forEach(function(NV){
    var grp=items.filter(function(x){return x.niveau===NV;}).sort(function(a,b){return a.ordre-b.ordre;});
    if(!grp.length) return;
    rows+='<div style="position:sticky;top:0;background:'+(LVLCOLOR[NV.toLowerCase()]||'#888')+';color:#fff;'+
      'font-weight:bold;font-size:13px;padding:4px 10px;border-radius:8px;margin-top:8px;">'+NV+' — '+grp.length+' contenu'+(grp.length>1?'s':'')+'</div>';
    rows+=grp.map(function(x){
      return '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--divider);font-size:13px;">'+
        '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(x.titre)+'</span>'+
        '<label style="white-space:nowrap;">🔧 <input type="checkbox" class="cb-masque" value="'+x.id+'"'+(masques.indexOf(x.id)>=0?' checked':'')+'></label>'+
        '<label style="white-space:nowrap;">🎓 <input type="checkbox" class="cb-demo" value="'+x.id+'"'+(demos.indexOf(x.id)>=0?' checked':'')+'></label>'+
        '</div>';
    }).join('');
  });
  return '<details style="background:#fff;border:1px solid var(--divider);border-radius:14px;padding:12px 14px;margin-bottom:14px;">'+
    '<summary style="font-weight:bold;cursor:pointer;">⚙️ Gestion du contenu — 🔧 masquer (en correction) · 🎓 mettre en démo publique</summary>'+
    '<div style="max-height:340px;overflow-y:scroll;margin-top:8px;padding-right:18px;scrollbar-gutter:stable;">'+rows+'</div>'+
    '<button id="btnGestion" style="margin-top:10px;background:var(--coral);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-weight:bold;cursor:pointer;font-family:Arial,sans-serif;">💾 Enregistrer</button>'+
    ' <span id="gestionFb" style="font-size:13px;font-weight:bold;"></span>'+
    '<div style="font-size:12px;color:var(--slate);margin-top:6px;">🔧 : la page affiche « en correction » aux élèves (toi tu y accèdes). 🎓 : visible sans connexion via la page publique <b>bienvenue.html</b> et son QR code — change la sélection quand tu veux, effet immédiat.</div>'+
    '</details>';
}

// ── Compositeur de tests (Eric, 28/07) : tests créés par le prof, sans déploiement ──
async function blocTests(){
  var c=CAT.raw; if(!c) return '';
  var cfg=null; try{ cfg=await window.LEM.getConfig('_testsProf'); }catch(e){}
  var defs=(cfg&&cfg.defs)||[];
  var sources=(c.exercices||[]).filter(function(e){return e.questions;});
  var opts=['A1','A2','B1','B2','C1','C2'].map(function(n){return '<option>'+n+'</option>';}).join('');
  var srcRows=sources.map(function(e){
    return '<label style="display:block;font-size:13px;padding:2px 0;"><input type="checkbox" class="cb-src" value="'+e.id+'" data-niveau="'+e.niveau+'"> '+e.niveau+' · '+esc(e.titre)+'</label>';
  }).join('');
  var existants=defs.map(function(d,i){
    return '<div style="display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;border-top:1px solid var(--divider);">'+
      '<span style="flex:1;">📝 '+esc(d.titre)+' ('+d.niveau+' · '+d.nbQuestions+' q'+(d.duree?' · '+d.duree+' min':'')+')</span>'+
      '<a href="french/tests/test.html?id='+d.id+'" style="font-size:12px;">ouvrir</a>'+
      '<button class="btn-suppr-test" data-i="'+i+'" style="background:none;border:none;color:#C0392B;font-weight:bold;cursor:pointer;">✕</button></div>';
  }).join('') || '<div style="font-size:13px;color:var(--slate);">Aucun test de prof pour l\'instant.</div>';
  return '<details style="background:#fff;border:1px solid var(--divider);border-radius:14px;padding:12px 14px;margin-bottom:14px;">'+
    '<summary style="font-weight:bold;cursor:pointer;">📝 Composer un test (sans déploiement)</summary>'+
    '<div style="margin-top:8px;font-size:14px;">'+
    'Titre : <input id="tpTitre" type="text" placeholder="Test de la semaine — Nombres" style="width:60%;font-family:Arial;padding:5px;border:1px solid var(--divider);border-radius:8px;"><br>'+
    'Niveau : <select id="tpNiveau" style="font-family:Arial;padding:4px;">'+opts+'</select> '+
    'Questions : <input id="tpNb" type="number" value="10" min="1" max="60" style="width:60px;padding:4px;"> '+
    'Durée (min, vide = sans limite) : <input id="tpDuree" type="number" min="1" max="120" style="width:60px;padding:4px;">'+
    '<div style="margin:8px 0 4px;font-weight:bold;">Sources (exercices avec banque) :</div>'+
    '<div style="max-height:180px;overflow-y:scroll;border:1px solid var(--divider);border-radius:8px;padding:6px 18px 6px 6px;scrollbar-gutter:stable;">'+srcRows+'</div>'+
    '<button id="btnTest" style="margin-top:10px;background:var(--navyMid);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-weight:bold;cursor:pointer;font-family:Arial,sans-serif;">➕ Créer le test</button>'+
    ' <span id="testFb" style="font-size:13px;font-weight:bold;"></span>'+
    '<div style="margin-top:10px;font-weight:bold;">Tes tests :</div>'+existants+
    '</div></details>';
}

// ── Pré-attribution de niveau par e-mail (nouveaux comptes, Eric 04/08) ──
async function blocPreassign(){
  var cfg=null; try{ cfg=await window.LEM.getConfig('_preassign'); }catch(e){}
  var emails=(cfg&&cfg.emails)||{};
  var rows=Object.keys(emails).sort().map(function(em){
    return '<div style="display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;border-top:1px solid var(--divider);">'+
      '<span class="lvl-pill" style="background:'+(LVLCOLOR[emails[em]]||'#888')+'">'+emails[em].toUpperCase()+'</span>'+
      '<span style="flex:1;">'+esc(em)+'</span>'+
      '<span style="font-size:12px;color:var(--slate);">en attente de 1re connexion</span>'+
      '<button class="btn-suppr-pre" data-em="'+esc(em)+'" style="background:none;border:none;color:#C0392B;font-weight:bold;cursor:pointer;">✕</button></div>';
  }).join('') || '<div style="font-size:13px;color:var(--slate);">Aucune pré-attribution.</div>';
  var opts=['a1','a2','b1','b2','c1','c2'].map(function(n){return '<option value="'+n+'">'+n.toUpperCase()+'</option>';}).join('');
  return '<details style="background:#fff;border:1px solid var(--divider);border-radius:14px;padding:12px 14px;margin-bottom:14px;">'+
    '<summary style="font-weight:bold;cursor:pointer;">🎯 Pré-attribuer un niveau (nouveaux comptes)</summary>'+
    '<div style="margin-top:8px;font-size:14px;">'+
    '<div style="font-size:12px;color:var(--slate);margin-bottom:8px;">La fiche d\'un élève naît à sa <b>première connexion</b>. Renseigne ici son e-mail et son niveau : il sera appliqué automatiquement à ce moment-là (sinon A1 par défaut).</div>'+
    'E-mail : <input id="preEmail" type="email" placeholder="eleve@exemple.com" style="width:46%;font-family:Arial;padding:5px;border:1px solid var(--divider);border-radius:8px;"> '+
    'Niveau : <select id="preNiveau" style="font-family:Arial;padding:4px;">'+opts+'</select> '+
    '<button id="btnPre" style="background:var(--navyMid);color:#fff;border:none;border-radius:10px;padding:7px 14px;font-weight:bold;cursor:pointer;font-family:Arial,sans-serif;">➕ Ajouter</button>'+
    ' <span id="preFb" style="font-size:13px;font-weight:bold;"></span>'+
    '<div style="margin-top:8px;">'+rows+'</div></div></details>';
}

function cableGestion(){
  var bp=document.getElementById('btnPre');
  if(bp) bp.addEventListener('click', async function(){
    var em=(document.getElementById('preEmail').value||'').trim().toLowerCase();
    var nv=document.getElementById('preNiveau').value;
    var fb=document.getElementById('preFb');
    if(!em||em.indexOf('@')<1){ fb.textContent='e-mail invalide'; fb.style.color='#C0392B'; return; }
    try{
      var cfg=await window.LEM.getConfig('_preassign')||{}; cfg.emails=cfg.emails||{};
      cfg.emails[em]=nv;
      await window.LEM.setConfig('_preassign',cfg);
      fb.textContent='✓ '+em+' → '+nv.toUpperCase(); fb.style.color='var(--green)';
    }catch(e){ fb.textContent='✗ échec'; fb.style.color='#C0392B'; }
  });
  document.querySelectorAll('.btn-suppr-pre').forEach(function(x){
    x.addEventListener('click', async function(){
      try{
        var cfg=await window.LEM.getConfig('_preassign')||{}; cfg.emails=cfg.emails||{};
        delete cfg.emails[x.getAttribute('data-em')];
        await window.LEM.setConfig('_preassign',cfg);
        x.closest('div').remove();
      }catch(e){}
    });
  });
  var b=document.getElementById('btnGestion');
  if(b) b.addEventListener('click', async function(){
    var masques=[].map.call(document.querySelectorAll('.cb-masque:checked'),function(x){return x.value;});
    var demos=[].map.call(document.querySelectorAll('.cb-demo:checked'),function(x){return x.value;});
    var fb=document.getElementById('gestionFb');
    try{
      await window.LEM.setConfig('_masquage',{ids:masques});
      await window.LEM.setConfig('_demo',{ids:demos});
      fb.textContent='✓ enregistré'; fb.style.color='var(--green)';
    }catch(e){ fb.textContent='✗ échec'; fb.style.color='#C0392B'; }
  });
  var bt=document.getElementById('btnTest');
  if(bt) bt.addEventListener('click', async function(){
    var fb=document.getElementById('testFb');
    var niveau=document.getElementById('tpNiveau').value;
    var srcs=[].map.call(document.querySelectorAll('.cb-src:checked'),function(x){return x.value;});
    var titre=document.getElementById('tpTitre').value.trim()||('Test '+niveau+' du '+new Date().toLocaleDateString('fr-FR'));
    var nb=parseInt(document.getElementById('tpNb').value,10)||10;
    var duree=parseInt(document.getElementById('tpDuree').value,10)||null;
    if(!srcs.length){ fb.textContent='choisis au moins une source'; fb.style.color='#C0392B'; return; }
    try{
      var cfg=await window.LEM.getConfig('_testsProf')||{defs:[]};
      cfg.defs=cfg.defs||[];
      cfg.defs.push({id:'TP-'+Date.now(), type:'test', niveau:niveau, titre:titre,
        sources:srcs, nbQuestions:nb, duree:duree, publie:true, ajoute:new Date().toISOString().slice(0,10)});
      await window.LEM.setConfig('_testsProf',cfg);
      fb.textContent='✓ créé — visible immédiatement sur la page '+niveau; fb.style.color='var(--green)';
    }catch(e){ fb.textContent='✗ échec'; fb.style.color='#C0392B'; }
  });
  document.querySelectorAll('.btn-suppr-test').forEach(function(x){
    x.addEventListener('click', async function(){
      try{
        var cfg=await window.LEM.getConfig('_testsProf')||{defs:[]};
        cfg.defs.splice(parseInt(x.getAttribute('data-i'),10),1);
        await window.LEM.setConfig('_testsProf',cfg);
        x.closest('div').remove();
      }catch(e){}
    });
  });
}

function render(content, students){
  if(!students.length){ content.innerHTML='<div class="notice">Aucun &eacute;l&egrave;ve pour l&rsquo;instant.</div>'; return; }
  var totalDone=0;
  var html='';
  students.sort(function(a,b){ return (a.name||a.email).localeCompare(b.name||b.email); });
  students.forEach(function(s){
    var lvl=(s.level||'a1').toLowerCase();
    var done=s.lessons.filter(function(l){return l.completed;}).length; totalDone+=done;
    html+='<div class="stu">';
    var opts=['a1','a2','b1','b2','c1','c2'].map(function(n){
      return '<option value="'+n+'"'+(n===lvl?' selected':'')+'>'+n.toUpperCase()+'</option>';
    }).join('');
    html+='<div class="stu-head"><span class="stu-name">'+esc(s.name||s.email||'(sans nom)')+'</span>'+
          '<span class="lvl-pill" style="background:'+(LVLCOLOR[lvl]||'#888')+'">'+lvl.toUpperCase()+'</span>'+
          '<label style="font-size:12px;color:var(--slate);margin-left:auto;">Niveau : '+
          '<select class="lvl-select" data-uid="'+esc(s.uid)+'" data-prev="'+lvl+'">'+opts+'</select></label>'+
          '<span class="lvl-saved" id="saved-'+esc(s.uid)+'"></span></div>';
    var pos=positionParcours(lvl, s.lessons);
    html+='<div class="stu-meta">'+esc(s.email)+' &nbsp;·&nbsp; &#128293; '+s.streak+' j &nbsp;·&nbsp; &#128218; '+s.vocab+' mots'+(pos?(' &nbsp;·&nbsp; '+pos):'')+'</div>';
    if(!s.lessons.length){
      html+='<div class="none">Aucun exercice commenc&eacute;.</div>';
    } else {
      // Barres par compétence (agrégat des scores × compétences du catalogue)
      var comp={};
      s.lessons.forEach(function(l){
        var meta=CAT.byProgress[l.id];
        if(!meta||typeof l.score!=='number'||typeof l.total!=='number'||!l.total) return;
        meta.competences.forEach(function(cp){
          comp[cp]=comp[cp]||{s:0,t:0}; comp[cp].s+=l.score; comp[cp].t+=l.total;
        });
      });
      var keys=['listening','reading','writing','speaking'].filter(function(k){return comp[k];});
      if(keys.length){
        html+='<div class="comp-zone">';
        keys.forEach(function(k){
          var pct=Math.round(100*comp[k].s/comp[k].t);
          html+='<div class="comp-row"><span class="comp-ico">'+COMP_LABELS[k]+'</span>'+
                '<span class="comp-bar"><span class="comp-fill" style="width:'+pct+'%"></span></span>'+
                '<span class="comp-pct">'+pct+'%</span></div>';
        });
        html+='</div>';
      }
      s.lessons.sort(function(a,b){ return (b.lastPracticed||0)-(a.lastPracticed||0); });
      s.lessons.forEach(function(l){
        var meta=CAT.byProgress[l.id], tmeta=CAT.byTest[l.id];
        var nm = meta ? (meta.niveau+' · '+meta.titre)
               : tmeta ? ('📝 '+tmeta.niveau+' · '+tmeta.titre)
               : (LESSON_NAMES[l.id]||l.id);
        var sc=(typeof l.score==='number'&&typeof l.total==='number')?('<span class="score">'+l.score+'/'+l.total+'</span>'):'—';
        var st=l.completed?'✓ terminé':'en cours';
        var dt=l.lastPracticed?(' · '+fdate(l.lastPracticed)):'';
        html+='<div class="lesson-row"><span class="lesson-name">'+esc(nm)+'</span>'+
              '<span class="lesson-meta">'+sc+' · '+st+fduree(l.dureeSec)+dt+'</span></div>';
        if(l.writings){ Object.keys(l.writings).forEach(function(k){
          html+='<div class="wblock"><div class="wtitle">✍️ '+esc(k)+'</div><div class="wtext">'+esc(l.writings[k])+'</div></div>';
        }); }
      });
    }
    html+='</div>';
  });
  content.innerHTML='<div class="summary">'+students.length+' élève(s) · '+totalDone+' exercice(s) terminé(s) au total</div>'+annonces(students)+html;
  Promise.all([blocGestion(), blocTests(), blocPreassign()]).then(function(blocs){
    content.insertAdjacentHTML('afterbegin', blocs[0]+blocs[1]+blocs[2]);
    cableGestion();
  });
  // Changement de niveau (les règles Firestore autorisent déjà le prof à écrire)
  content.querySelectorAll('.lvl-select').forEach(function(sel){
    sel.addEventListener('change', async function(){
      var uid=sel.getAttribute('data-uid'), nv=sel.value, prev=sel.getAttribute('data-prev');
      var fb=document.getElementById('saved-'+uid);
      sel.disabled=true;
      try{
        await setDoc(doc(window.LEM.db,'users',uid), { level: nv }, { merge:true });
        sel.setAttribute('data-prev', nv);
        if(fb){ fb.textContent='✓ enregistré'; setTimeout(function(){ fb.textContent=''; }, 2500); }
      }catch(e){
        sel.value=prev;
        if(fb){ fb.textContent='✗ échec'; fb.style.color='#C0392B'; }
        console.error('[leo-et-moi] changement de niveau :', e);
      }
      sel.disabled=false;
    });
  });
}
</script>
